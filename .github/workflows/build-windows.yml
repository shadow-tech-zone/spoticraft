name: Build Windows App

# QA GATE: pehle ubuntu par live tests (resolver + Electron smoke),
# pass hon tab hi Windows build + release. Fail = koi product nahi.
on:
  push:
    branches:
      - arena/09cac133-spoticraft
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stream resolver test (live)
        run: node test/rescue.e2e.mjs

      - name: Electron smoke (asal app mein gaana play)
        working-directory: app
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgtk-3-0 libnss3 libasound2t64 > /dev/null 2>&1
          npm install --no-audit --no-fund > /dev/null 2>&1
          BLOOMEE_SMOKE=1 xvfb-run -a npx electron . --no-sandbox --disable-gpu > /tmp/smoke.txt 2>&1 || true
          grep SMOKE_RESULT /tmp/smoke.txt | tail -1
          grep -q '"ok":true' /tmp/smoke.txt

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build (NSIS + Portable)
        working-directory: app
        run: npx electron-builder --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bloomee-Windows
          path: |
            app/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Get version
        id: ver
        working-directory: app
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish portable to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Bloomee v${{ steps.ver.outputs.v }}
          body: "Windows portable build — download Bloomee-Portable-${{ steps.ver.outputs.v }}.exe and run. Unsigned: SmartScreen par More info → Run anyway."
          files: app/dist/Bloomee-Portable-*.exe
          fail_on_unmatched_files: true
