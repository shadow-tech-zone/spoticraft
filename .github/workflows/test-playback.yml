name: Live Playback Test

# Asal network par stream resolution ka test.
# Sandbox se music sites + Actions logs dono block hain, is liye
# result repo mein file commit hota hai (test/results/latest.txt).
on:
  push:
    branches:
      - arena/09cac133-spoticraft
    paths:
      - 'app/core/**'
      - 'test/playback.e2e.mjs'
      - 'test/rescue.e2e.mjs'
      - 'test/debug-yt.mjs'
      - '.github/workflows/test-playback.yml'

permissions:
  contents: write

jobs:
  stream-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Live stream test (JioSaavn + YouTube Music)
        run: |
          set +e
          mkdir -p test/results
          node test/playback.e2e.mjs > test/results/latest.txt 2>&1
          echo "EXIT=$?" >> test/results/latest.txt
          node test/debug-yt.mjs > test/results/yt-debug.txt 2>&1 || true
          node test/rescue.e2e.mjs > test/results/rescue.txt 2>&1
          echo "EXIT=$?" >> test/results/rescue.txt
          cat test/results/latest.txt
          echo "----- RESCUE -----"
          cat test/results/rescue.txt

      - name: Electron smoke (asal app, asal <audio> playback)
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgtk-3-0 libnss3 libasound2t64 > /dev/null 2>&1
          (cd app && npm install --no-audit --no-fund > /dev/null 2>&1)
          (cd app && BLOOMEE_SMOKE=1 xvfb-run -a npx electron . --no-sandbox --disable-gpu > ../smoke-out.txt 2>&1)
          grep -o 'SMOKE_RESULT .*' smoke-out.txt | tail -1 | sed 's/^SMOKE_RESULT //' > test/results/smoke.txt
          echo "----- SMOKE -----"
          cat test/results/smoke.txt

      - name: UI screenshot report (QA)
        run: |
          set +e
          (cd app && BLOOMEE_SHOTS=1 xvfb-run -a npx electron . --no-sandbox --disable-gpu > ../shots-out.txt 2>&1)
          mkdir -p test/results/shots
          cp app/shots-home.png test/results/shots/home.png 2>/dev/null || tail -5 shots-out.txt
          cp app/shots-detail.png test/results/shots/detail.png 2>/dev/null || true
          cp app/shots-search.png test/results/shots/search.png 2>/dev/null || true

      - name: Commit results
        if: always()
        run: |
          git config user.name "bloomee-ci"
          git config user.email "ci@bloomee.local"
          git add test/results/latest.txt test/results/yt-debug.txt test/results/rescue.txt test/results/smoke.txt test/results/shots
          git commit -m "test results [skip ci]" || echo "nothing new"
          git pull --rebase origin arena/09cac133-spoticraft || true
          git push origin HEAD:arena/09cac133-spoticraft

      - name: Fail job if tests failed
        if: always()
        run: |
          grep -q "ALL PASS" test/results/rescue.txt
          grep -q '"ok":true' test/results/smoke.txt
