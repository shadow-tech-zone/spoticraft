name: Live Playback Test

# Asal network par stream resolution ka test.
# Sandbox se music sites + Actions logs dono block hain, is liye
# result repo mein file commit hota hai (test/results/latest.txt).
on:
  push:
    branches:
      - arena/09cac133-spoticraft
    paths:
      - 'app/core/**'
      - 'test/playback.e2e.mjs'
      - 'test/debug-yt.mjs'
      - '.github/workflows/test-playback.yml'

permissions:
  contents: write

jobs:
  stream-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Live stream test (JioSaavn + YouTube Music)
        run: |
          mkdir -p test/results
          node test/playback.e2e.mjs > test/results/latest.txt 2>&1
          echo "EXIT=$?" >> test/results/latest.txt
          node test/debug-yt.mjs > test/results/yt-debug.txt 2>&1 || true
          cat test/results/latest.txt
          echo "----- YT DEBUG -----"
          cat test/results/yt-debug.txt

      - name: Commit results
        if: always()
        run: |
          git config user.name "bloomee-ci"
          git config user.email "ci@bloomee.local"
          git add test/results/latest.txt test/results/yt-debug.txt
          git commit -m "test results [skip ci]" || echo "nothing new"
          git pull --rebase origin arena/09cac133-spoticraft || true
          git push origin HEAD:arena/09cac133-spoticraft

      - name: Fail job if test failed
        if: always()
        run: grep -q "ALL PASS" test/results/latest.txt
