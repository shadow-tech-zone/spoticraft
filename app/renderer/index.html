<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; media-src https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'">
<title>Bloomee</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ══════════ TITLE BAR ══════════ -->
  <header id="titlebar">
    <div class="tb-left">
      <button class="logo" data-act="go-home" title="Bloomee">
        <span class="logo-mark"><svg class="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span><span class="logo-text">Bloomee</span>
      </button>
      <button class="navbtn" id="btn-back" data-act="back" title="Go back"><svg class="ic" viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12l4.58-4.59z"/></svg></button>
      <button class="navbtn" id="btn-fwd" data-act="forward" title="Go forward"><svg class="ic" viewBox="0 0 24 24"><path d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12l-4.58 4.59z"/></svg></button>
    </div>
    <div class="tb-center">
      <div class="searchbox">
        <span class="search-ic"><svg class="ic" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
        <input id="search" type="text" placeholder="What do you want to play?" autocomplete="off" spellcheck="false">
        <button class="search-clear hidden" id="search-clear" data-act="clear-search"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
        <div id="suggest" class="suggest hidden"></div>
      </div>
    </div>
    <div class="tb-right">
      <button class="iconbtn" data-act="menu-app" title="Settings and more"><svg class="ic" viewBox="0 0 24 24"><path d="M5 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></button>
      <div class="winbtns">
        <button class="winbtn" data-act="win-min" title="Minimize"><svg class="ic ic-xs" viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg></button>
        <button class="winbtn" id="win-max" data-act="win-max" title="Maximize"><svg class="ic ic-xs" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M5 5h14v14H5V5zm2 2v10h10V7H7z"/></svg></button>
        <button class="winbtn danger" data-act="win-close" title="Close"><svg class="ic ic-xs" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      </div>
    </div>
  </header>

  <!-- ══════════ SHELL ══════════ -->
  <div id="shell">
    <aside id="sidebar" class="panel">
      <nav class="lib-nav">
        <button class="navitem" data-act="go-home" id="nav-home"><span class="nv-ic"><svg class="ic" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>Home</button>
        <button class="navitem" data-act="go-charts" id="nav-charts"><span class="nv-ic"><svg class="ic" viewBox="0 0 24 24"><path d="M5 20V10h3v10H5zm5.5 0V4h3v16h-3zM16 20v-7h3v7h-3z"/></svg></span>Top Charts</button>
      </nav>
      <div class="lib-head">
        <span class="lib-title"><span class="nv-ic"><svg class="ic" viewBox="0 0 24 24"><path d="M5 3h3.5v18H5V3zm5.5 0H14v18h-3.5V3zm5.7.6 3.6 1-4.8 17.4-3.6-1L16.2 3.6z"/></svg></span>Your Library</span>
        <button class="iconbtn sm" data-act="new-playlist" title="Create playlist"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
      </div>
      <div id="lib-list" class="lib-list"></div>
      <div class="sidebar-foot">
        <div class="src-label">Music source</div>
        <div class="chips" id="src-chips"></div>
      </div>
    </aside>

    <main id="main" class="panel">
      <div id="view"></div>
    </main>

    <aside id="rightpanel" class="panel hidden">
      <div class="rp-head">
        <div class="rp-tabs">
          <button class="rp-tab" data-act="rp-tab" data-tab="now">Now Playing</button>
          <button class="rp-tab" data-act="rp-tab" data-tab="queue">Queue</button>
          <button class="rp-tab" data-act="rp-tab" data-tab="lyrics">Lyrics</button>
        </div>
        <button class="iconbtn sm" data-act="rp-close"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      </div>
      <div id="rp-body"></div>
    </aside>
  </div>

  <!-- ══════════ PLAYER ══════════ -->
  <footer id="player">
    <div class="np-left" id="np-left"></div>
    <div class="np-center">
      <div class="transport">
        <button class="tbtn" id="btn-shuffle" data-act="shuffle" title="Shuffle"><svg class="ic" viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
        <button class="tbtn" data-act="prev" title="Previous"><svg class="ic" viewBox="0 0 24 24"><path d="M7 6h2.5v12H7V6zm11.5.5v11L10 12l8.5-5.5z"/></svg></button>
        <button class="playbtn" id="btn-play" data-act="toggle" title="Play"><svg class="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="tbtn" data-act="next" title="Next"><svg class="ic" viewBox="0 0 24 24"><path d="M14.5 6H17v12h-2.5V6zM5.5 6.5v11L14 12 5.5 6.5z"/></svg></button>
        <button class="tbtn" id="btn-repeat" data-act="repeat" title="Repeat"><svg class="ic" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
      </div>
      <div class="seekrow">
        <span class="time" id="t-cur">0:00</span>
        <div class="slider" id="seek"><div class="slider-fill"></div><div class="slider-knob"></div></div>
        <span class="time" id="t-dur">0:00</span>
      </div>
    </div>
    <div class="np-right">
      <button class="iconbtn" id="btn-rp-lyrics" data-act="rp-lyrics" title="Lyrics"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></button>
      <button class="iconbtn" id="btn-rp-queue" data-act="rp-queue" title="Queue"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg></button>
      <span class="vol-ic" id="vol-ic"><svg class="ic" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></span>
      <div class="slider sm" id="vol"><div class="slider-fill"></div><div class="slider-knob"></div></div>
      <button class="iconbtn" data-act="fs-lyrics" title="Full screen"><svg class="ic" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
    </div>
  </footer>

  <!-- overlays -->
  <div id="fslyrics" class="hidden"></div>
  <div id="menu" class="hidden"></div>
  <div id="modal" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <audio id="audio" preload="auto"></audio>

  <script type="module" src="app.js"></script>
</body>
</html>
